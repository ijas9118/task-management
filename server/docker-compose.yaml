services:
  api-gateway:
    container_name: api-gateway
    build:
      context: ./api-gateway
      dockerfile: Dockerfile.dev
    image: api-gateway-img
    volumes:
      - ./api-gateway:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./api-gateway/.env
    command: ["npm", "run", "dev"]
    depends_on:
      - redis-stack

  auth-service:
    container_name: auth-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile.dev
    image: auth-service-img
    volumes:
      - ./auth-service:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    env_file:
      - ./auth-service/.env
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run dev"
    depends_on:
      - postgres-db
      - redis-stack

  user-service:
    container_name: user-service
    build:
      context: ./user-service
      dockerfile: Dockerfile.dev
    image: user-service-img
    volumes:
      - ./user-service:/app
      - /app/node_modules
    ports:
      - "3002:3002"
    env_file:
      - ./user-service/.env
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run dev"
    depends_on:
      - postgres-db
      - redis-stack

  task-service:
    container_name: task-service
    build:
      context: ./task-service
      dockerfile: Dockerfile.dev
    image: task-service-img
    volumes:
      - ./task-service:/app
      - /app/node_modules
    ports:
      - "3003:3003"
    env_file:
      - ./task-service/.env
    command: ["npm", "run", "dev"]
    depends_on:
      - mongo-db
      - redis-stack

  postgres-db:
    container_name: postgres-db
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypostgresdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  mongo-db:
    container_name: mongo-db
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  redis-stack:
    container_name: redis-stack
    image: redis/redis-stack:7.2.0-v18
    restart: always
    environment:
      REDIS_ARGS: "--requirepass cantremember"
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-stack-data:/data

volumes:
  postgres-data:
  mongodb-data:
  redis-stack-data:
