services:
  user-service:
    container_name: user-service
    build:
      context: ./user-service
      dockerfile: Dockerfile.dev
    image: user-service-img
    volumes:
      - ./user-service:/app
      - /app/node_modules
    ports:
      - "3002:3002"
    env_file:
      - ./user-service/.env
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run dev"
    depends_on:
      - postgres-db
      - redis-stack

  auth-service:
    container_name: auth-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile.dev
    image: auth-service-img
    volumes:
      - ./auth-service:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    env_file:
      - ./auth-service/.env
    command: >
      sh -c "npx prisma migrate deploy &&
             npm run dev"
    depends_on:
      - postgres-db
      - redis-stack

  postgres-db:
    container_name: postgres-db
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypostgresdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  redis-stack:
    container_name: redis-stack
    image: redis/redis-stack:7.2.0-v18
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-stack-data:/data

volumes:
  postgres-data:
  redis-stack-data:
